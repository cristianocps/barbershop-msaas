version: "3.9"

services:

  # ──────────────────────────────────────────────
  # PostgreSQL  –  banco de dados principal
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_barbershop
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwas7845}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_prod_db}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barbershop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbershop_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis  –  cache / sessão
  # ──────────────────────────────────────────────
  redis_barbershop:
    image: redis:7-alpine
    container_name: redis_barbershop
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - barbershop_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend  –  ASP.NET Core 8
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend/Controle_Barbearia
      dockerfile: Dockerfile
    container_name: barbershop_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-barbershop_prod_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-qwas7845}"
      JwtSettings__Secret: ${JWT_SECRET:-abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._@+}
      JwtSettings__Issuer: Barbershop_backend
      JwtSettings__Audience: BarbershopApp
      JwtSettings__ExpirationInMinutes: "1440"
    ports:
      - "5508:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis_barbershop:
        condition: service_healthy
    networks:
      - barbershop_net

  # ──────────────────────────────────────────────
  # Frontend  –  React / Vite (Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Barbearia
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://208.109.189.35:5508}
    container_name: barbershop_frontend
    restart: unless-stopped
    ports:
      - "5509:80"
    depends_on:
      - backend
    networks:
      - barbershop_net

# ──────────────────────────────────────────────
# Volumes persistentes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ──────────────────────────────────────────────
# Rede interna
# ──────────────────────────────────────────────
networks:
  barbershop_net:
    driver: bridge
