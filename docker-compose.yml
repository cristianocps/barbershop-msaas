version: "3.9"

services:

  # ──────────────────────────────────────────────
  # PostgreSQL 17  –  banco de dados principal
  # O banco é criado automaticamente pelo container
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres_barbershop
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwas7845}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop_prod_db}
    ports:
      - "5440:5432"          # porta 5440 exposta no servidor (igual ao appsettings)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barbershop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbershop_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis  –  cache / sessão
  # nome do container = redis_barbershop
  # ──────────────────────────────────────────────
  redis_barbershop:
    image: redis:7-alpine
    container_name: redis_barbershop
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - barbershop_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend  –  ASP.NET Core 8
  # Porta interna Kestrel: 8080
  # Porta exposta no servidor: 5508
  # Conecta ao postgres pelo nome do service (interno Docker)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend/Controle_Barbearia
      dockerfile: Dockerfile
    pull_policy: build
    container_name: barbershop_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Usa o nome do service 'postgres' como host (rede interna Docker)
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-barbershop_prod_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-qwas7845}"
      JwtSettings__Secret: ${JWT_SECRET:-abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._@+}
      JwtSettings__Issuer: Barbershop_backend
      JwtSettings__Audience: BarbershopApp
      JwtSettings__ExpirationInMinutes: "1440"
      # Origens extras para CORS alem das fixas no Program.cs
      CorsOrigins: "http://app.barbershopp.com.br,https://app.barbershopp.com.br"
    ports:
      - "5508:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis_barbershop:
        condition: service_healthy
    networks:
      - barbershop_net

  # ──────────────────────────────────────────────
  # Frontend  –  React / Vite (Nginx)
  # Porta exposta no servidor: 5509
  #
  # ⚠️  VITE_API_URL usa o IP externo do servidor propositalmente!
  #    O Vite bake a URL no bundle JS que roda no NAVEGADOR do cliente.
  #    O navegador não está dentro do Docker — precisa do endereço público.
  #    Comunicação interna (backend <-> postgres) usa nomes dos services.
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Barbearia
      dockerfile: Dockerfile
    pull_policy: build
    container_name: barbershop_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - barbershop_net

# ──────────────────────────────────────────────
# Volumes persistentes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ──────────────────────────────────────────────
# Rede interna compartilhada entre todos os services
# ──────────────────────────────────────────────
networks:
  barbershop_net:
    driver: bridge
